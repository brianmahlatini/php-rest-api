name: php-rest-api
services:
  app:
    build: { context: ., dockerfile: docker/Dockerfile }
    environment:
      DB_DSN: mysql:host=db;dbname=app;charset=utf8mb4
      DB_USER: app
      DB_PASSWORD: ${DB_PASSWORD:-local-dev-only}
      JWT_SECRET: ${JWT_SECRET:-local-dev-secret-change-me-0123456789abcdef}
      CORS_ORIGINS: http://localhost:5173,http://localhost:4200
    depends_on:
      db: { condition: service_healthy }
  web:
    image: nginx:1.29-alpine
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./public:/var/www/public:ro
    ports: ["127.0.0.1:8080:8080"]
    depends_on: [app]
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: app
      MYSQL_USER: app
      MYSQL_PASSWORD: ${DB_PASSWORD:-local-dev-only}
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uapp", "-p${DB_PASSWORD:-local-dev-only}"]
      interval: 5s
      retries: 30
    volumes: [db-data:/var/lib/mysql]
volumes:
  db-data:
