expose_php = Off
display_errors = Off
log_errors = On
error_log = /proc/self/fd/2
memory_limit = 128M
post_max_size = 1M
upload_max_filesize = 1M
opcache.enable = 1
opcache.validate_timestamps = 0   ; immutable containers: never stat files
opcache.max_accelerated_files = 10000
session.use_strict_mode = 1
